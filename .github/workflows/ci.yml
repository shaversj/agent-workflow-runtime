name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.32.1

      - name: Install dependencies
        run: make install

      - name: Run checks
        run: make check
