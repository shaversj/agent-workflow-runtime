      <title id="coding-agent-architecture-title">
        A gated path from coding request to draft pull request
      </title>
      <desc id="coding-agent-architecture-desc">
        Architecture diagram showing CLI or Discord requests passing through policy admission, a
        validated plugin catalog, an offline coding agent, fresh verification, human approval, and
        separate draft pull request publication while activity is recorded to SQLite.
      </desc>
